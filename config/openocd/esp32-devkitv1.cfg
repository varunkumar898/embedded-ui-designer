# ESP32 DEVKIT V1 Configuration
# Board: ESP32-DEVKIT-V1 (30-pin version with USB)
# Chip: ESP32 (Dual-core, 240 MHz)

adapter driver ftdi
ftdi device_desc "FTDI"
ftdi vid_pid 0x0403 0x6010
ftdi layout_init 0x0008 0x000b
ftdi layout_signal nTRST -data 0x0010 -noe 0x0010
ftdi layout_signal nSRST -data 0x0020 -noe 0x0020

# Target
source [find target/esp32.cfg]

# Board initialization
reset_config srst_only
