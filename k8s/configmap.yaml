apiVersion: v1
kind: ConfigMap
metadata:
  name: embedded-ui-config
  labels:
    app: embedded-ui-platform
data:
  PORT: "8080"
  NODE_ENV: "production"
  TLS_ENFORCEMENT: "1.3"
  RATE_LIMIT_MAX_REQ: "100"
  RATE_LIMIT_WINDOW_SEC: "60"
  CONNECTION_POOL_MAX: "100"
  LOG_LEVEL: "info"
  METRICS_ENABLED: "true"
