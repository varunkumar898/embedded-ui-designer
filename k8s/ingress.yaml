apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: embedded-ui-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "64m"
spec:
  rules:
    - host: embedded-ui.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: embedded-ui-platform
                port:
                  number: 8080
