apiVersion: apps/v1
kind: Deployment
metadata:
  name: embedded-ui-platform
  labels:
    app: embedded-ui-platform
    tier: production
spec:
  replicas: 3
  selector:
    matchLabels:
      app: embedded-ui-platform
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: embedded-ui-platform
    spec:
      containers:
        - name: embedded-ui-platform
          image: ghcr.io/varunkumar898/embedded-ui-designer:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: embedded-ui-config
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1536Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
