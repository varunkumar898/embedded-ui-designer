name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-cross-platform:
    name: Build on ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Linux
            arch: x86_64
            runner: ubuntu-latest
            cmake_platform: Linux
            cmake_arch: x86_64
          - os: Linux
            arch: ARM64
            runner: ubuntu-24.04-arm
            cmake_platform: Linux
            cmake_arch: ARM64
          - os: macOS
            arch: x86_64
            runner: macos-latest
            cmake_platform: macOS
            cmake_arch: x86_64
            osx_arch: x86_64
          - os: macOS
            arch: ARM64
            runner: macos-latest
            cmake_platform: macOS
            cmake_arch: ARM64
            osx_arch: arm64
          - os: Windows
            arch: x86_64
            runner: windows-latest
            cmake_platform: Windows
            cmake_arch: x86_64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect Platform and Architecture
        shell: bash
        run: |
          echo "Target OS: ${{ matrix.os }}"
          echo "Target Architecture: ${{ matrix.arch }}"
          uname -a || true

      - name: Install Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential cmake ninja-build libjsoncpp-dev nodejs npm

      - name: Install Dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja jsoncpp node

      - name: Install Dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install cmake ninja nodejs -y

      - name: Configure CMake
        shell: bash
        run: |
          mkdir -p build
          cd build
          EXTRA_FLAGS=""
          if [ -n "${{ matrix.osx_arch }}" ]; then
            EXTRA_FLAGS="-DCMAKE_OSX_ARCHITECTURES=${{ matrix.osx_arch }}"
          fi
          cmake -DPLATFORM=${{ matrix.cmake_platform }} \
                -DARCH=${{ matrix.cmake_arch }} \
                -DENABLE_TESTS=ON \
                -DENABLE_SECURITY_HARDENING=ON \
                -DENABLE_OBSERVABILITY=ON \
                $EXTRA_FLAGS ..

      - name: Build All Targets
        shell: bash
        run: |
          cd build
          cmake --build . --target test_project_model test_codegen_multi_language test_security_performance test_compliance_observability --config Release

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            build/test_project_model*
            build/test_codegen_multi_language*
            build/test_security_performance*
            build/test_compliance_observability*
            build/bin/test_project_model*
            build/bin/test_codegen_multi_language*
            build/bin/test_security_performance*
            build/bin/test_compliance_observability*
            build/bin/Release/test_project_model*
            build/bin/Release/test_codegen_multi_language*
            build/bin/Release/test_security_performance*
            build/bin/Release/test_compliance_observability*
            build/Release/test_project_model*
            build/Release/test_codegen_multi_language*
            build/Release/test_security_performance*
            build/Release/test_compliance_observability*
