name: Embedded UI Designer CI/CD

on:
  push:
    branches: [ main, develop, 'feature/**' ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Verify Output (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            build_type: Release
            generator: ""
            exe_path: "build/Release/EmbeddedUIDesigner.exe"
          - os: ubuntu-24.04
            build_type: Release
            generator: "Ninja"
            exe_path: "./build/EmbeddedUIDesigner"
          - os: macos-14
            build_type: Release
            generator: "Ninja"
            exe_path: "./build/EmbeddedUIDesigner.app/Contents/MacOS/EmbeddedUIDesigner"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Qt 6.5 LTS
        uses: jurplel/install-qt-action@v4.4.1
        with:
          version: '6.5.3'
          arch: ${{ startsWith(matrix.os, 'windows') && 'win64_msvc2019_64' || '' }}
          modules: 'qtserialport'
          cache: true

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev libxkbcommon-dev libx11-dev xvfb

      - name: Install macOS Dependencies
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure Designer CMake
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_PREFIX_PATH="${{ env.QT_ROOT_DIR }}"
          ${{ matrix.generator != '' && format('-G "{0}"', matrix.generator) || '' }}

      - name: Build Designer Executable
        run: cmake --build build --config ${{ matrix.build_type }} --parallel 4

      - name: Prepare Designer Binary in Root
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp build/Release/EmbeddedUIDesigner.exe ./EmbeddedUIDesigner.exe
          elif [ "$RUNNER_OS" = "macOS" ]; then
            cp build/EmbeddedUIDesigner.app/Contents/MacOS/EmbeddedUIDesigner ./EmbeddedUIDesigner
          else
            cp build/EmbeddedUIDesigner ./EmbeddedUIDesigner
          fi
          chmod +x ./EmbeddedUIDesigner 2>/dev/null || true

      - name: Verify Features & Capture Screenshots
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            export PATH="${{ env.QT_ROOT_DIR }}/bin:$PATH"
          elif [ "$RUNNER_OS" = "Linux" ]; then
            export QT_QPA_PLATFORM=offscreen
          fi
          echo "=== Verifying Feature 1: Named Color Styles ==="
          ./EmbeddedUIDesigner --verify-feature1 verification_feature1.png
          echo "=== Verifying Feature 2: Custom Components ==="
          ./EmbeddedUIDesigner --verify-feature2 verification_feature2.png
          ls -la verification_*.png

      - name: Upload Verification Screenshots
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Verification-Screenshots
          path: verification_*.png

      - name: Test Headless Code Generation (CLI Mode)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            export PATH="${{ env.QT_ROOT_DIR }}/bin:$PATH"
          fi
          mkdir -p /tmp/out
          echo "=== Exporting µGFX Project to /tmp/out ==="
          ./EmbeddedUIDesigner --export ugfx --project examples/simple.euiproj --out /tmp/out
          
          echo "=== Exporting Qt for MCUs (QUL) Project ==="
          ./EmbeddedUIDesigner --export qul --project examples/simple.euiproj --out build/qul_out

          echo "=== Exporting LVGL (C/C++) Project ==="
          ./EmbeddedUIDesigner --export lvgl --project examples/simple.euiproj --out build/lvgl_out

      - name: Clone µGFX for Export Build Verification
        if: runner.os != 'macOS'
        run: |
          git clone --depth 1 https://git.ugfx.io/uGFX/ugfx.git ugfx_lib

      - name: Compile Exported µGFX Project (Guarantees Working Output)
        if: runner.os != 'macOS'
        shell: bash
        run: |
          echo "=== Configuring Exported µGFX Build ==="
          UGFX_DIR="${GITHUB_WORKSPACE//\\//}/ugfx_lib"
          cmake -S /tmp/out -B /tmp/out/build -DUGFX_PATH="$UGFX_DIR"
          echo "=== Compiling Exported µGFX Binary ==="
          cmake --build /tmp/out/build --config Release

      - name: Package Windows Portable Release
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist/EmbeddedUIDesigner
          cp build/Release/EmbeddedUIDesigner.exe dist/EmbeddedUIDesigner/
          "${{ env.QT_ROOT_DIR }}/bin/windeployqt.exe" --release --no-translations dist/EmbeddedUIDesigner/EmbeddedUIDesigner.exe
          cd dist && 7z a ../EmbeddedUIDesigner-Windows-x64-Portable.zip EmbeddedUIDesigner/

      - name: Upload Windows Portable Zip
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: EmbeddedUIDesigner-Windows-x64-Portable
          path: EmbeddedUIDesigner-Windows-x64-Portable.zip

      - name: Run CPack Packaging
        working-directory: build
        run: cpack -C ${{ matrix.build_type }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EmbeddedUIDesigner-${{ runner.os }}
          path: build/EmbeddedUIDesigner-*.*
          if-no-files-found: warn
