name: Security Scanning

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * 0' # Weekly Sunday scan

jobs:
  sast-and-compliance:
    name: SAST, Dependency, and Secrets Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube SAST Scan
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        continue-on-error: true

      - name: OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'embedded-ui-designer'
          path: '.'
          format: 'HTML'
        continue-on-error: true

      - name: TruffleHog Secrets Scanning
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --debug --only-verified
        continue-on-error: true

  secrets-gate:
    name: Hardcoded Secrets Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Grep-based secret scan (failing)
        run: |
          chmod +x scripts/check-secrets.sh
          scripts/check-secrets.sh

  case-collision-gate:
    name: Case Collision Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect tracked paths differing only by case
        run: |
          chmod +x scripts/check-case-collisions.sh
          scripts/check-case-collisions.sh
