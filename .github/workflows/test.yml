name: Acceptance Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_run:
    workflows: ["Build"]
    types: [completed]

jobs:
  acceptance-tests:
    name: Run 102 Acceptance Tests (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Linux
            runner: ubuntu-latest
          - os: macOS
            runner: macos-latest
          - os: Windows
            runner: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential cmake ninja-build libjsoncpp-dev

      - name: Install System Dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja jsoncpp

      - name: Install System Dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install cmake ninja -y

      - name: Configure and Build Test Targets
        shell: bash
        run: |
          mkdir -p build && cd build
          cmake -DENABLE_TESTS=ON ..
          cmake --build . --target test_project_model test_codegen_multi_language test_security_performance test_compliance_observability embedweb_simulator test_mcu_driver_packs --config Release

      - name: "Phase 1 (Weeks 3-4): Project Model & Schema Tests (20 Tests)"
        shell: bash
        run: |
          for p in ./build/bin/Release/test_project_model.exe ./build/bin/test_project_model.exe ./build/bin/test_project_model ./build/Release/test_project_model.exe ./build/test_project_model.exe ./build/test_project_model; do
            if [ -f "$p" ]; then
              "$p"
              exit 0
            fi
          done
          echo "Binary test_project_model not found" && exit 1

      - name: "Phase 2 (Weeks 5-6): Multi-Language Code Generators (24 Tests)"
        shell: bash
        run: |
          for p in ./build/bin/Release/test_codegen_multi_language.exe ./build/bin/test_codegen_multi_language.exe ./build/bin/test_codegen_multi_language ./build/Release/test_codegen_multi_language.exe ./build/test_codegen_multi_language.exe ./build/test_codegen_multi_language; do
            if [ -f "$p" ]; then
              "$p"
              exit 0
            fi
          done
          echo "Binary test_codegen_multi_language not found" && exit 1

      - name: "Phase 3 (Weeks 7-8): Frontend Integration & Full-Stack Tests (18 Tests)"
        shell: bash
        run: node src/frontend/tests/integration_runner.js

      - name: "Phase 4 (Weeks 9-10): Security Hardening & Performance Optimization (24 Tests)"
        shell: bash
        run: |
          for p in ./build/bin/Release/test_security_performance.exe ./build/bin/test_security_performance.exe ./build/bin/test_security_performance ./build/Release/test_security_performance.exe ./build/test_security_performance.exe ./build/test_security_performance; do
            if [ -f "$p" ]; then
              "$p"
              exit 0
            fi
          done
          echo "Binary test_security_performance not found" && exit 1

      - name: "Phase 5 (Weeks 11-12): Documentation, CI/CD & Observability (16 Tests)"
        shell: bash
        run: |
          for p in ./build/bin/Release/test_compliance_observability.exe ./build/bin/test_compliance_observability.exe ./build/bin/test_compliance_observability ./build/Release/test_compliance_observability.exe ./build/test_compliance_observability.exe ./build/test_compliance_observability; do
            if [ -f "$p" ]; then
              "$p"
              exit 0
            fi
          done
          echo "Binary test_compliance_observability not found" && exit 1

      - name: Run Full CTest Verification Suite
        shell: bash
        run: |
          cd build
          ctest -C Release --verbose --output-on-failure
