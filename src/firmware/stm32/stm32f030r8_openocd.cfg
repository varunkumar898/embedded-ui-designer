# ==============================================================================
# OpenOCD Configuration for STM32F030R8 Nucleo Board (NUCLEO-F030R8)
# ST-Link v2 / v2.1 interface and Cortex-M0 target
# ==============================================================================

# Interface configuration
# Supports modern OpenOCD 0.12+ as well as legacy interface syntax
if { [catch { source [find interface/stlink.cfg] }] } {
    if { [catch { adapter driver hla; hla_layout stlink }] } {
        catch { interface stlink }
    }
}

# Transport selection
catch { transport select hla_swd }

# Target configuration
source [find target/stm32f0x.cfg]

# Adapter speed (kHz)
adapter speed 1000

# Debug level (2 = warnings & informational messages)
debug_level 2

# Reset strategy
reset_config srst_only

# Telnet port (for Embedded UI Designer live hardware control)
telnet_port 4444

# GDB server port
gdb_port 3333

# Exit on disconnect (safe fallback if supported by build)
catch { shutdown_on_connection_fail off }
