<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Embedded UI Designer API Explorer (Swagger UI / ReDoc)</title>
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css">
  <style>
    body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; }
    .header-bar { display: flex; align-items: center; justify-content: space-between; padding: 1rem 2rem; background: #1e293b; border-bottom: 1px solid #334155; }
    .header-bar h1 { margin: 0; font-size: 1.25rem; color: #38bdf8; }
    .tab-btn { background: #334155; color: #fff; border: none; padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer; margin-left: 0.5rem; }
    .tab-btn.active { background: #0284c7; }
    #swagger-container { background: #fff; }
  </style>
</head>
<body>
  <div class="header-bar">
    <h1>Embedded UI Designer — Interactive REST API Explorer</h1>
    <div>
      <button class="tab-btn active" id="swaggerTabBtn">Swagger UI</button>
      <button class="tab-btn" id="redocTabBtn">ReDoc</button>
    </div>
  </div>

  <div id="swagger-container"></div>
  <div id="redoc-container" style="display:none;">
    <redoc spec-url="../schema.json"></redoc>
  </div>

  <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
  <script src="https://cdn.redoc.ly/redoc/latest/bundles/redoc.standalone.js"></script>
  <script>
    const spec = {
      openapi: "3.0.0",
      info: {
        title: "Embedded UI Designer API",
        version: "1.0.0",
        description: "Production REST API for embedded hardware control"
      },
      servers: [
        { url: "http://localhost:8080/api/v1", description: "Local Development Server" },
        { url: "https://embedded-device.local:8443/api/v1", description: "Production HTTPS Hardware" }
      ],
      paths: {
        "/readGpio": {
          get: {
            summary: "Read GPIO pin logic level",
            parameters: [{ name: "pin", in: "query", required: true, schema: { type: "integer" } }],
            responses: { 200: { description: "Current pin logic state" } }
          }
        },
        "/readAdc": {
          get: {
            summary: "Read analog ADC channel",
            parameters: [{ name: "channel", in: "query", required: true, schema: { type: "integer" } }],
            responses: { 200: { description: "12-bit ADC raw readout" } }
          }
        },
        "/setPwm": {
          post: {
            summary: "Set PWM duty cycle",
            requestBody: {
              content: { "application/json": { schema: { type: "object", properties: { pin: { type: "integer" }, dutyCycle: { type: "integer" } } } } }
            },
            responses: { 200: { description: "PWM update acknowledged" } }
          }
        }
      }
    };

    window.ui = SwaggerUIBundle({
      spec: spec,
      dom_id: '#swagger-container',
      deepLinking: true
    });

    document.getElementById('swaggerTabBtn').onclick = () => {
      document.getElementById('swagger-container').style.display = 'block';
      document.getElementById('redoc-container').style.display = 'none';
      document.getElementById('swaggerTabBtn').classList.add('active');
      document.getElementById('redocTabBtn').classList.remove('active');
    };

    document.getElementById('redocTabBtn').onclick = () => {
      document.getElementById('swagger-container').style.display = 'none';
      document.getElementById('redoc-container').style.display = 'block';
      document.getElementById('redocTabBtn').classList.add('active');
      document.getElementById('swaggerTabBtn').classList.remove('active');
      Redoc.init(spec, {}, document.getElementById('redoc-container'));
    };
  </script>
</body>
</html>
