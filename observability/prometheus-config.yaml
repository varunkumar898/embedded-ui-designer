global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'embedded-ui-designer'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['localhost:8080', '192.168.1.100:8080']
        labels:
          environment: 'production'
          tier: 'embedded-firmware'
