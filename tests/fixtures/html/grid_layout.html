<!DOCTYPE html>
<html>
<head>
  <style>
    .grid-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 8px;
      width: 200px;
      height: 200px;
    }
  </style>
</head>
<body>
  <div class="grid-container">
    <div id="cell1">Cell 1</div>
    <div id="cell2">Cell 2</div>
    <div id="cell3">Cell 3</div>
    <div id="cell4">Cell 4</div>
  </div>
</body>
</html>
